services:
  portfolio:
    image: ghcr.io/n0xum/p0rtfolio:latest
    pull_policy: always
    container_name: portfolio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
    name: nginx-proxy-manager_proxy
