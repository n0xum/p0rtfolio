# -----------------------------------------------------------------------
# Security headers
# -----------------------------------------------------------------------
# nginx `add_header` inheritance rule: an `add_header` inside a location
# block DISCARDS every `add_header` inherited from the server block for
# requests that match that location -- it does not merge with the parent.
#
# The two extension-based locations below each set their own Cache-Control
# via add_header (as they must, to get different cache lifetimes for
# immutable hashed assets vs. HTML documents). Before this fix that meant
# every real HTML document and every static asset -- i.e. essentially all
# production traffic -- shipped with NONE of the headers that were only
# declared once, at server level. Only requests matching neither regex
# (e.g. /robots.txt, /sitemap.xml, an exact extensionless path) ever saw
# them. Confirmed with `curl -I` against a running container before this
# change: X-Frame-Options/X-Content-Type-Options/Referrer-Policy were
# present on /robots.txt and /sitemap.xml but absent on /, /projects/*/,
# and every /_next/static/*.js and *.css response.
#
# Fix: the same block of add_header directives is repeated verbatim in
# every location that itself calls add_header (the asset location and the
# html location), plus kept at server level so it is inherited unchanged
# by any location that does NOT declare its own add_header (the "/"
# prefix location, and the two `location =` redirects below). There is no
# nginx primitive to factor this into a single literal include *file*
# without an extra Dockerfile COPY line for that file -- Dockerfile is out
# of this file's ownership, so the include is done "by copy-paste inside
# one file" instead. If these three blocks are ever edited, keep them
# byte-for-byte identical -- that is the actual "include snippet" here.
#
# X-XSS-Protection is deliberately NOT set: it is deprecated, unsupported
# by any current browser, and the legacy heuristic auditor it used to
# enable has itself been the source of real XSS vulnerabilities in the
# past (browsers now rely on CSP instead).
#
# HSTS starts at a short max-age (300s = 5 minutes) so a misconfiguration
# is only briefly sticky for a returning visitor's browser while this is
# rolled out. Ramp plan (raise once HTTPS has been solid in production for
# a while, each step is a separate deploy so a rollback is cheap):
#   max-age=300                        <- current (this change)
#   max-age=86400;  includeSubDomains  <- after ~1-2 weeks of clean HTTPS
#   max-age=2592000; includeSubDomains <- after ~1-2 months
#   max-age=63072000; includeSubDomains; preload  <- submit to
#     https://hstspreload.org only once max-age has been >= 1 year AND
#     you are certain every current and future subdomain will always be
#     served over HTTPS (preload is effectively permanent / very slow and
#     painful to undo across browser vendors).
#
# Content-Security-Policy directive-by-directive justification:
#   default-src 'self'          -- deny-by-default fallback for any
#                                   fetch directive not listed explicitly.
#   script-src 'self' 'unsafe-inline'
#                                -- see the long comment further down: this
#                                   app is a Next.js App Router static
#                                   export, which emits multiple *distinct,
#                                   per-page* inline `<script>` tags
#                                   (`self.__next_f.push(...)`) carrying
#                                   the RSC/hydration payload. Their byte
#                                   content differs per page and per build
#                                   (it includes fetched GitHub README text
#                                   on project pages), so they cannot be
#                                   sha256-pinned in a static nginx config.
#                                   Verified in a real headless Chrome
#                                   (Puppeteer) run against this exact
#                                   built image: a hash-only script-src
#                                   (pinning ONLY the two
#                                   dangerouslySetInnerHTML scripts) blocks
#                                   those payload scripts outright, throws
#                                   React hydration error #412, and leaves
#                                   the page non-interactive (theme toggle
#                                   does nothing). 'self' still blocks any
#                                   attacker-injected <script src> pointed
#                                   at a third-party origin, which is the
#                                   part of script-src a static export can
#                                   actually enforce.
#   style-src 'self' 'unsafe-inline'
#                                -- Next emits inline `style="..."` attributes
#                                   on some elements at runtime. Verified: a
#                                   style-src without 'unsafe-inline' blocks
#                                   those with `style-src-attr` violations
#                                   (three of them on /). CSP hash-sources
#                                   do not apply to style *attributes*
#                                   without the separate 'unsafe-hashes'
#                                   keyword, and the attribute content is as
#                                   dynamic as the inline scripts, so the
#                                   same "cannot be statically hashed"
#                                   reasoning applies.
#   img-src 'self' https://img.shields.io https://raw.githubusercontent.com
#           https://camo.githubusercontent.com
#                                -- project pages render GitHub README
#                                   markdown client-side (MarkdownRenderer /
#                                   ReactMarkdown), which can contain <img>
#                                   tags pointing at badge/CDN hosts. None
#                                   of the READMEs fetched at the time of
#                                   writing (structify, cli-tool,
#                                   portfolio-website, zigbee-controller)
#                                   actually reference these hosts today
#                                   (verified: grepped the built HTML/RSC
#                                   payload and the raw README source of
#                                   all four repos via `gh api`), but any
#                                   README on GitHub conventionally can, and
#                                   a maintainer adding a badge later should
#                                   not silently break their own badge.
#                                   Deliberately NOT a wildcard/https: --
#                                   only the three concrete hosts markdown
#                                   badges realistically use.
#   font-src 'self'              -- IBM Plex Sans is self-hosted via
#                                   next/font (verified: /_next/static/media/
#                                   *.woff2 in the built HTML, and no
#                                   fonts.gstatic.com / fonts.googleapis.com
#                                   reference anywhere in the built output).
#   connect-src 'self'           -- no client-side fetch()/XHR to any API;
#                                   all GitHub API calls happen at build
#                                   time only (src/lib/github.ts, server-side).
#   object-src 'none'            -- no <object>/<embed> anywhere in the app;
#                                   also blocks legacy plugin-based XSS vectors.
#   base-uri 'none'              -- no <base> tag is emitted; blocks an
#                                   injected <base> from hijacking relative URLs.
#   form-action 'self'           -- no forms post to a third party.
#   frame-ancestors 'self'       -- CSP-level equivalent/superset of the
#                                   X-Frame-Options header below, kept for
#                                   browsers that only honor one or the other.
#   upgrade-insecure-requests    -- belt-and-suspenders for any stray http:
#                                   sub-resource reference once the site is
#                                   served over HTTPS.
#
# Both dangerouslySetInnerHTML scripts (the pre-hydration theme-flash
# script in app/layout.tsx and the Person JSON-LD in components/JsonLd.tsx)
# were still hashed and verified below for documentation/CI-drift-detection
# purposes even though the hashes are NOT enforced in script-src above (see
# why above). Regenerate both after any change to either script:
#
#   docker build --secret id=github_token,env=GITHUB_TOKEN \
#     -t portfolio-hash-check ./frontend
#   docker create --name hash-check-extract portfolio-hash-check >/dev/null
#   docker cp hash-check-extract:/usr/share/nginx/html/index.html /tmp/index.html
#   docker rm -f hash-check-extract >/dev/null
#   python3 - <<'PYEOF'
#   import re, hashlib, base64
#   html = open("/tmp/index.html", encoding="utf-8").read()
#   for m in re.finditer(r'<script([^>]*)>(.*?)</script>', html, re.S):
#       attrs, body = m.group(1), m.group(2)
#       if 'src=' in attrs or '__next_f' in body:
#           continue
#       digest = hashlib.sha256(body.encode('utf-8')).digest()
#       label = "JSON-LD" if 'ld+json' in attrs else "theme-flash"
#       print(label, "sha256-" + base64.b64encode(digest).decode())
#   PYEOF
#
# theme-flash (app/layout.tsx inline script) : sha256-zm68JmReW+EilyAhqc7cM3l2UQOONpy4qG+BbgcGIo0=
# JSON-LD     (components/JsonLd.tsx)         : sha256-gDAo7DRvYg2Aws5bYm1bmp2iuRwnFKcDiFrHZqo+ozg=
#
# CI recommendation for the build-deploy agent's successor: run the
# extraction above in CI, assert both hashes still match these two
# constants (fail the build on drift so a change to either script is a
# deliberate, reviewed diff to this file's comment block), but do NOT wire
# them into the enforced script-src -- doing so reintroduces the hydration
# breakage demonstrated above.
#
# Brotli (task 5): NOT added. Confirmed against the exact `nginx:alpine`
# base image this Dockerfile uses (`nginx -V`): no ngx_http_brotli_*
# module is compiled in or present as a loadable .so under
# /usr/lib/nginx/modules/. Adding `brotli on;`/`brotli_types ...;` to this
# file was tested directly against this image and fails `nginx -t` outright
# ("unknown directive"), which would crash the container rather than
# silently no-op. Getting brotli would require switching to a different
# base image (one built with the brotli dynamic modules, e.g. an
# nginx:alpine image with ngx_brotli compiled in, or openresty) -- that is
# a Dockerfile/base-image decision outside this file's ownership.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Server-level fallback: inherited as-is by any location below that
    # does NOT itself call add_header (the "/" location and the two
    # `location =` redirects). Kept byte-for-byte identical to the copies
    # inside the asset and html locations.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.shields.io https://raw.githubusercontent.com https://camo.githubusercontent.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # This is `output: 'export'` with `trailingSlash: true`: every route is
    # statically generated at build time as a real directory containing
    # index.html. There is no client-side-only route that lacks a file on
    # disk, so there is nothing legitimate for a `/index.html` catch-all to
    # catch. Falling back to /index.html here (as this used to do) makes
    # every unmatched path -- typos, stale/removed slugs, /wp-admin/ probes
    # -- return HTTP 200 with the home page: a soft-404 that (a) makes
    # src/app/not-found.tsx's built /404.html permanently unreachable for
    # any real 404 that would otherwise hit this location, and (b) gets
    # typo'd/stale URLs indexed by crawlers as duplicate home pages. Fail
    # closed instead: `=404` triggers `error_page 404 /404.html` below,
    # which serves the real, styled 404 page with an actual 404 status.
    location / {
        try_files $uri $uri/ $uri.html =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.shields.io https://raw.githubusercontent.com https://camo.githubusercontent.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.shields.io https://raw.githubusercontent.com https://camo.githubusercontent.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }

    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.shields.io https://raw.githubusercontent.com https://camo.githubusercontent.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }

    # -------------------------------------------------------------------
    # Wave 3b removes the `cli-tool` and `portfolio-website` project slugs
    # (replaced by `zigbee-controller`). Both URLs are in the *current*
    # live sitemap and are indexed, so once the corresponding /out pages
    # disappear they would otherwise 404 for existing inbound links/search
    # results. Redirect them narrowly (exact match, not a pattern) to the
    # work section instead of dead-ending.
    #
    # NOTE: these two blocks become dead config if a human ever restores
    # either project slug -- remove them at that point rather than leaving
    # a redirect masking a real page.
    # -------------------------------------------------------------------
    location = /projects/cli-tool/ {
        return 301 /#work;
    }

    location = /projects/portfolio-website/ {
        return 301 /#work;
    }

    error_page 404 /404.html;
}
