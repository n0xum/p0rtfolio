name: Build & Deploy Portfolio

# Image: native build per architecture (amd64 on x86 runners, arm64 on ARM runners), then one multi-arch manifest.
# Tags: sha-<commit> (immutable) and main (moves; this is what the server pulls).
# Deploy: only through the deploy gate on the host (`ssh deploy@host true`). The compose file stays on the server; this
# workflow neither uploads files nor runs free-form commands. It is switched on by the repository variable
# PORTFOLIO_DEPLOY_ENABLED=true, after the stack on the server has been tested.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # This repo has no root package.json - the app lives in frontend/.
          # The action reads `packageManager` from this file, so the pnpm
          # version stays declared in exactly one place. `working-directory`
          # does not apply to an action's inputs, only to `run` steps.
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: ./frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: ./frontend
        # `next build` statically generates /projects/[slug], which calls the
        # GitHub API at build time (src/lib/github.ts). Runner IPs are heavily
        # rate-limited unauthenticated, and the fetch deliberately fails loud
        # on 403 rather than shipping a half-rendered page - so without a
        # token this step fails intermittently by design.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

  build:
    name: Build image (${{ matrix.platform }})
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          # No tag here: the manifest job tags the merged image. GITHUB_TOKEN is a BuildKit secret, not a build ARG,
          # so `pnpm build` (src/lib/github.ts) can use it without it ever being stored in a layer or the history.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.merge.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify the manifest list
        id: merge
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          digests=(*)
          [ "${#digests[@]}" = 2 ] || { echo "expected exactly one digest per architecture, got: ${digests[*]}" >&2; exit 1; }
          sources=(); for d in "${digests[@]}"; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create -t "$IMAGE:main" -t "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          out=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA")
          for arch in linux/amd64 linux/arm64; do
            grep -q "$arch" <<<"$out" || { echo "manifest list lacks $arch" >&2; echo "$out" >&2; exit 1; }
          done
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          { echo "### $IMAGE"; echo "- tags: \`main\`, \`sha-$GITHUB_SHA\`"; echo "- index digest: \`$digest\`"; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The server pulls and swaps by itself: this job only asks the gate to do it.
  deploy:
    name: Deploy through the gate
    needs: manifest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PORTFOLIO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://alexanderkruska.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Environment-scoped: SSH_PRIVATE_KEY (secret), SSH_HOST, SSH_PORT, SSH_KNOWN_HOSTS (variables).
      - name: Configure constrained SSH client
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: bash scripts/ci/configure-gate-ssh.sh

      - name: Run the server-side gate only
        run: ssh -F "$RUNNER_TEMP/ssh/config" gate true | tee "$RUNNER_TEMP/gate.log"

      - name: Record the gate result
        if: always()
        env:
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          { echo "### gate: $GITHUB_SHA"; echo "- image index: \`$DIGEST\`"; echo '```'; cat "$RUNNER_TEMP/gate.log" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key material
        if: always()
        run: rm -f "$RUNNER_TEMP/ssh/id_key" "$RUNNER_TEMP/ssh/known_hosts" "$RUNNER_TEMP/ssh/config" "$RUNNER_TEMP/gate.log"
