name: Build & Deploy Portfolio

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVICE: portfolio
  COMPOSE_DIR: /srv/web/portfolio
  SSH_OPTS: -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o TCPKeepAlive=yes

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # This repo has no root package.json - the app lives in frontend/.
          # The action reads `packageManager` from this file, so the pnpm
          # version stays declared in exactly one place. `working-directory`
          # does not apply to an action's inputs, only to `run` steps.
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: ./frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: ./frontend
        # `next build` statically generates /projects/[slug], which calls the
        # GitHub API at build time (src/lib/github.ts). Runner IPs are heavily
        # rate-limited unauthenticated, and the fetch deliberately fails loud
        # on 403 rather than shipping a half-rendered page - so without a
        # token this step fails intermittently by design.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

  build-and-push:
    name: Build and Push Docker Image
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          # GITHUB_TOKEN is passed as a BuildKit secret, not a build ARG, so it
          # is available to `pnpm build` (see src/lib/github.ts) without ever
          # being persisted in an image layer or build history.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Auf dem VPS nur ziehen und tauschen (kein Build) ──────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH-Zugang einrichten
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Image ziehen und Container tauschen
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "COMPOSE_DIR='$COMPOSE_DIR' SERVICE='$SERVICE' bash -euo pipefail -s" <<'ENDSSH'
            cd "$COMPOSE_DIR"
            docker compose pull "$SERVICE"
            docker compose up -d "$SERVICE"
          ENDSSH

      - name: Healthcheck
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "COMPOSE_DIR='$COMPOSE_DIR' SERVICE='$SERVICE' bash -euo pipefail -s" <<'ENDSSH'
            cd "$COMPOSE_DIR"
            for attempt in $(seq 1 24); do
              if docker compose ps "$SERVICE" --format json | grep -q '"healthy"'; then
                echo "Container ist gesund (nach $((attempt * 5))s)"
                exit 0
              fi
              echo "warte auf gesunden Zustand … ($attempt/24)"
              sleep 5
            done
            echo "FEHLER: Container wird nicht gesund." >&2
            docker compose logs --tail=100 "$SERVICE" >&2
            exit 1
          ENDSSH

      - name: Verwaiste Images entfernen
        if: success()
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" "docker image prune -f"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key
