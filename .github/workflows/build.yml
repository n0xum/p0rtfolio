name: Build & Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVICE: portfolio
  COMPOSE_DIR: /srv/web/portfolio
  SSH_OPTS: -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o TCPKeepAlive=yes

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Auf dem VPS nur ziehen und tauschen (kein Build) ──────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH-Zugang einrichten
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Image ziehen und Container tauschen
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "COMPOSE_DIR='$COMPOSE_DIR' SERVICE='$SERVICE' bash -euo pipefail -s" <<'ENDSSH'
            cd "$COMPOSE_DIR"
            docker compose pull "$SERVICE"
            docker compose up -d "$SERVICE"
          ENDSSH

      - name: Healthcheck
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "COMPOSE_DIR='$COMPOSE_DIR' SERVICE='$SERVICE' bash -euo pipefail -s" <<'ENDSSH'
            cd "$COMPOSE_DIR"
            for attempt in $(seq 1 24); do
              if docker compose ps "$SERVICE" --format json | grep -q '"healthy"'; then
                echo "Container ist gesund (nach $((attempt * 5))s)"
                exit 0
              fi
              echo "warte auf gesunden Zustand … ($attempt/24)"
              sleep 5
            done
            echo "FEHLER: Container wird nicht gesund." >&2
            docker compose logs --tail=100 "$SERVICE" >&2
            exit 1
          ENDSSH

      - name: Verwaiste Images entfernen
        if: success()
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" "docker image prune -f"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key
